name: CI

on:
  push:
    branches: [main]
  pull_request:

# Native dep versions live in .github/deps.env (single source of truth, shared
# with scripts/fetch-native-deps.sh). The piper1-gpl / espeak-ng / sonic
# revisions are pinned as git submodule SHAs instead (see .gitmodules).
# Each job that needs versions loads them into the environment as its first
# step after checkout.

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install Android packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run JVM unit tests
        run: ./gradlew test --stacktrace

  native-build:
    name: Native build (3 ABIs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Load pinned dependency versions
        run: grep -v '^#' .github/deps.env | grep -v '^$' >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Cache NDK
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/ndk
          key: ndk-${{ env.NDK_VERSION }}-${{ runner.os }}
      - name: Install Android packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;$NDK_VERSION"
      - name: Fetch native deps
        run: ./scripts/fetch-native-deps.sh
      - uses: gradle/actions/setup-gradle@v4
      # Verifies the piper1-gpl patch applies at configure time and the C++
      # compiles for arm64-v8a, armeabi-v7a and x86_64.
      - name: Build native libs for all ABIs
        run: ./gradlew :piper-engine:assembleDebug --stacktrace

  device-tests:
    name: Device tests (emulator)
    # macOS runners have hardware acceleration for the ARM emulator (the
    # Linux runners have no KVM at all). The large runner gives the
    # emulator enough CPU/RAM to boot reliably; minutes are free on the
    # public repo.
    runs-on: macos-15-large
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Load pinned dependency versions
        run: grep -v '^#' .github/deps.env | grep -v '^$' >> "$GITHUB_ENV"
      - name: Record submodule SHAs
        run: echo "ESPEAK_NG_SHA=$(git -C third-party/espeak-ng rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Cache NDK and system image
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk
            ${{ env.ANDROID_HOME }}/system-images
          key: android-emu-${{ env.NDK_VERSION }}-api30-arm64-${{ runner.os }}
      - name: Install Android packages
        run: >
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          "ndk;$NDK_VERSION" "system-images;android-30;google_apis;arm64-v8a"
      - name: Fetch native deps
        run: ./scripts/fetch-native-deps.sh
      - name: Cache staged espeak-ng-data
        id: espeak-cache
        uses: actions/cache@v4
        with:
          path: third-party/espeak-ng/build/espeak-ng-data
          key: espeak-ng-data-${{ env.ESPEAK_NG_SHA }}-${{ runner.os }}
      - name: Stage espeak-ng-data
        if: steps.espeak-cache.outputs.cache-hit != 'true'
        run: ./scripts/stage-espeak-data.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: arm64-v8a
          target: google_apis
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot -no-audio -no-boot-anim
          script: |
            adb push third-party/espeak-ng/build/espeak-ng-data /data/local/tmp/espeak-ng-data
            ./gradlew :piper-engine:connectedAndroidTest --stacktrace
